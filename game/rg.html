<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src-admin/styles.css">
    <title>Оплаты группы — Mortal Sales</title>
</head>
<body>
    <div class="scene-glow"></div>
    <div class="admin-card rg-card">
        <div class="eyebrow">Mortal Sales · Калуга</div>
        <h1 id="title">Оплаты группы</h1>

        <form id="pin-form" onsubmit="event.preventDefault()">
            <label for="pin">PIN-код руководителя группы</label>
            <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" required />
            <button type="submit">Войти<span class="btn-arrow">→</span></button>
        </form>

        <div id="panel" hidden>
            <p id="rg-date" class="current-status"></p>
            <div id="rg-counter"></div>
            <p class="hint">Одна оплата = один удар. Ошиблись в сумме: нажмите «Отменить» и внесите заново.</p>
            <div id="rg-list"></div>
            <button type="button" id="logout" class="ghost logout">Выйти</button>
        </div>

        <p id="status" role="status"></p>
    </div>

    <script type="module" src="/src-rg/main.ts"></script>
</body>
</html>
